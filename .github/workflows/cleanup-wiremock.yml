name: Cleanup WireMock containers

on:
  workflow_run:
    workflows: ['*']
    types: [completed]

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Only run when the triggering workflow was cancelled
    if: github.event.workflow_run.conclusion == 'cancelled'
    steps:
      - name: Stop any leftover WireMock Runner containers
        run: |
          docker ps --filter "name=wiremock-runner-" -q | xargs -r docker stop
