name: CI

# Lint, typecheck, unit tests + all scenario integration tests in one workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

# ─────────────────────────────────────────────────────────────────────────────
# Lint, typecheck, unit tests, dist freshness
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint-test:
    name: 'Lint & Tests'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Verify dist is up to date
        run: |
          npm run build
          git diff --quiet dist/ || {
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          }

# ─────────────────────────────────────────────────────────────────────────────
# UC-4: Ephemeral serve — push pre-committed stubs to Cloud, then serve them
# ─────────────────────────────────────────────────────────────────────────────
  uc4-ephemeral-serve:
    name: 'UC-4: Ephemeral serve'
    runs-on: ubuntu-latest
    environment: integration
    needs: lint-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Create development environment
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: environments-create
          profile: development

      - name: Push pre-committed stubs to development
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: push
          all: 'true'
          profile: development

      - name: Run tests against mock API
        id: mocks
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          mode: serve
          profile: development
          ports: '8080'
          run: |
            set -euo pipefail
            echo "WIREMOCK_URL=$WIREMOCK_URL"
            echo "WIREMOCK_URLS=$WIREMOCK_URLS"
            echo "WIREMOCK_MODE=$WIREMOCK_MODE"

            # Assert stub responds correctly
            RESPONSE=$(curl -sf "$WIREMOCK_URL/todos/1")
            echo "Response: $RESPONSE"
            echo "$RESPONSE" | grep -q "stub: buy groceries" || {
              echo "ERROR: expected stub response body not found"
              exit 1
            }

            # Assert list endpoint
            LIST=$(curl -sf "$WIREMOCK_URL/todos")
            echo "$LIST" | grep -q "walk the dog" || {
              echo "ERROR: todos list stub not found"
              exit 1
            }
            echo "All serve assertions passed."

      - name: Verify step outputs
        run: |
          echo "mock-api-url=${{ steps.mocks.outputs.mock-api-url }}"
          echo "mock-api-urls=${{ steps.mocks.outputs.mock-api-urls }}"
          echo "runner-admin-url=${{ steps.mocks.outputs.runner-admin-url }}"
          [ -n "${{ steps.mocks.outputs.mock-api-url }}" ] || { echo "ERROR: mock-api-url output missing"; exit 1; }
          [ -n "${{ steps.mocks.outputs.mock-api-urls }}" ] || { echo "ERROR: mock-api-urls output missing"; exit 1; }

# ─────────────────────────────────────────────────────────────────────────────
# UC-7: Resolve URLs (sidecar pattern)
# Runner started manually after checkout so wiremock.yaml is available.
# ─────────────────────────────────────────────────────────────────────────────
  uc7-resolve-urls:
    name: 'UC-7: Resolve URLs (sidecar)'
    runs-on: ubuntu-latest
    environment: integration
    needs: lint-test
    permissions:
      contents: read
    outputs:
      mock-api-urls: ${{ steps.resolve.outputs.mock-api-urls }}
      mock-api-url: ${{ steps.resolve.outputs.mock-api-url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Start WireMock Runner
        run: bash scripts/start-wiremock-runner.sh
        env:
          WMC_API_TOKEN: ${{ secrets.WIREMOCK_API_TOKEN }}

      - name: Resolve mock service URLs
        id: resolve
        uses: ./
        with:
          command: resolve-urls
          runner-admin-url: http://localhost:9999

      - name: Verify outputs
        run: |
          echo "mock-api-url=${{ steps.resolve.outputs.mock-api-url }}"
          echo "mock-api-urls=${{ steps.resolve.outputs.mock-api-urls }}"
          [ "${{ steps.resolve.outputs.mock-api-url }}" = "http://localhost:8080" ] || {
            echo "ERROR: unexpected mock-api-url: ${{ steps.resolve.outputs.mock-api-url }}"
            exit 1
          }

      - name: Stop Runner
        if: always()
        run: docker stop wiremock-runner || true

# ─────────────────────────────────────────────────────────────────────────────
# UC-10: Cross-job URL sharing — downstream job consumes UC-7 outputs
# ─────────────────────────────────────────────────────────────────────────────
  uc10-cross-job-urls:
    name: 'UC-10: Cross-job URL sharing'
    needs: [lint-test, uc7-resolve-urls]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Use URLs from upstream job
        run: |
          URLS='${{ needs.uc7-resolve-urls.outputs.mock-api-urls }}'
          PRIMARY='${{ needs.uc7-resolve-urls.outputs.mock-api-url }}'
          echo "Received mock-api-urls: $URLS"
          echo "Received mock-api-url:  $PRIMARY"
          echo "$URLS" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          assert 'todos-api' in data, f'todos-api missing from: {data}'
          assert data['todos-api'] == 'http://localhost:8080'
          print('Cross-job URL assertion passed.')
          "

# ─────────────────────────────────────────────────────────────────────────────
# UC-3: environments-create — bootstrap development + staging profiles in Cloud
# ─────────────────────────────────────────────────────────────────────────────
  uc3-environments-create:
    name: 'UC-3: environments-create'
    runs-on: ubuntu-latest
    environment: integration
    needs: lint-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Create development environment (idempotent)
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: environments-create
          profile: development

      - name: Create staging environment (idempotent)
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: environments-create
          profile: staging

      - name: Verify profile files were created
        run: |
          ls -la .wiremock/
          test -f .wiremock/wiremock-development.yaml || { echo "ERROR: wiremock-development.yaml not created"; exit 1; }
          test -f .wiremock/wiremock-staging.yaml || { echo "ERROR: wiremock-staging.yaml not created"; exit 1; }
          echo "Profile files created successfully."
          cat .wiremock/wiremock-development.yaml
          cat .wiremock/wiremock-staging.yaml

      - name: Re-run environments-create (idempotency check — must not fail)
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: environments-create
          profile: development

# ─────────────────────────────────────────────────────────────────────────────
# UC-1: push — push local stubs to WireMock Cloud
# ─────────────────────────────────────────────────────────────────────────────
  uc1-push:
    name: 'UC-1: push to Cloud'
    needs: [lint-test, uc3-environments-create]
    runs-on: ubuntu-latest
    environment: integration
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Create environments (required before push with profile)
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: environments-create
          profile: development

      - name: Create staging environment
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: environments-create
          profile: staging

      - name: Push all mock APIs to development
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: push
          all: 'true'
          profile: development

      - name: Push all mock APIs to staging
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: push
          all: 'true'
          profile: staging

# ─────────────────────────────────────────────────────────────────────────────
# UC-2: pull — pull stubs from Cloud back into workspace
# ─────────────────────────────────────────────────────────────────────────────
  uc2-pull:
    name: 'UC-2: pull from Cloud'
    needs: [lint-test, uc1-push]
    runs-on: ubuntu-latest
    environment: integration
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Create development environment (so profile yaml exists)
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: environments-create
          profile: development

      - name: Pull stubs from development
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: pull
          all: 'true'
          profile: development

      - name: Verify pulled stubs exist locally
        run: |
          echo "Contents of .wiremock after pull:"
          find .wiremock -type f | sort
          STUB_COUNT=$(find .wiremock -name "*.json" -o -name "*.yaml" | grep -v wiremock\.yaml | grep -v wiremock-development\.yaml | wc -l)
          echo "Stub files found: $STUB_COUNT"
          [ "$STUB_COUNT" -gt 0 ] || { echo "ERROR: no stub files found after pull"; exit 1; }

# ─────────────────────────────────────────────────────────────────────────────
# UC-5: Ephemeral record-many — record real API traffic, flush, pull stubs
# ─────────────────────────────────────────────────────────────────────────────
  uc5-ephemeral-record:
    name: 'UC-5: Ephemeral record-many'
    needs: [lint-test, uc3-environments-create]
    runs-on: ubuntu-latest
    environment: integration
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Create development environment (profile yaml required for record-many)
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: environments-create
          profile: development

      - name: Record API traffic and pull stubs
        id: recording
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          mode: record-many
          profile: development
          ports: '8080'
          post-run-pull: 'true'
          run: bash scripts/record-journey.sh

      - name: Verify recording outputs
        run: |
          echo "recording-flushed=${{ steps.recording.outputs.recording-flushed }}"
          [ "${{ steps.recording.outputs.recording-flushed }}" = "true" ] || {
            echo "ERROR: recording-flushed output should be true"
            exit 1
          }

      - name: Verify stubs were pulled after recording
        run: |
          echo "Contents of .wiremock after record+pull:"
          find .wiremock -type f | sort
          STUB_COUNT=$(find .wiremock -name "*.json" -o -name "*.yaml" | grep -v "wiremock.*\.yaml" | wc -l)
          echo "Stub files: $STUB_COUNT"
          [ "$STUB_COUNT" -gt 0 ] || { echo "ERROR: no stubs pulled after recording"; exit 1; }

# ─────────────────────────────────────────────────────────────────────────────
# UC-6: Sidecar record-many — mode-switch, record, flush, pull
# Runner started manually after checkout so wiremock.yaml is available.
# ─────────────────────────────────────────────────────────────────────────────
  uc6-sidecar-record:
    name: 'UC-6: Sidecar record-many (mode-switch + flush)'
    needs: [lint-test, uc3-environments-create]
    runs-on: ubuntu-latest
    environment: integration
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Create development environment (profile yaml required for recording)
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: environments-create
          profile: development

      - name: Start WireMock Runner (serve mode)
        run: bash scripts/start-wiremock-runner.sh
        env:
          WMC_API_TOKEN: ${{ secrets.WIREMOCK_API_TOKEN }}
          WMC_RUN_PROFILE: development

      - name: Resolve mock URLs (verifies Runner is healthy)
        id: mocks
        uses: ./
        with:
          command: resolve-urls
          runner-admin-url: http://localhost:9999

      - name: Switch to record-many mode
        uses: ./
        with:
          command: mode-switch
          target-mode: record-many
          runner-admin-url: http://localhost:9999

      - name: Generate API traffic (recorded by Runner)
        run: bash scripts/record-journey.sh
        env:
          WIREMOCK_URL: ${{ steps.mocks.outputs.mock-api-url }}

      - name: Flush recordings and switch back to serve
        id: flush
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: record-flush-and-stop
          runner-admin-url: http://localhost:9999

      - name: Verify flush output
        run: |
          echo "recording-flushed=${{ steps.flush.outputs.recording-flushed }}"
          [ "${{ steps.flush.outputs.recording-flushed }}" = "true" ] || {
            echo "ERROR: expected recording-flushed=true"
            exit 1
          }

      - name: Pull recorded stubs
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: pull
          all: 'true'
          profile: development

      - name: Stop Runner
        if: always()
        run: docker stop wiremock-runner || true

# ─────────────────────────────────────────────────────────────────────────────
# UC-8: Promote — pull from development, push to staging (GitOps flow)
# ─────────────────────────────────────────────────────────────────────────────
  uc8-promote:
    name: 'UC-8: Promote development → staging'
    needs: [lint-test, uc5-ephemeral-record, uc1-push]
    runs-on: ubuntu-latest
    environment: integration
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Create environments (profile yamls required for push/pull)
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: environments-create
          profile: development

      - name: Create staging environment
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: environments-create
          profile: staging

      - name: Pull stubs from development
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: pull
          all: 'true'
          profile: development

      - name: Push stubs to staging
        uses: ./
        with:
          api-token: ${{ secrets.WIREMOCK_API_TOKEN }}
          command: push
          all: 'true'
          profile: staging

# ─────────────────────────────────────────────────────────────────────────────
# UC-9: mode-switch with runner-config (batched recording config)
# Runner started manually after checkout so wiremock.yaml is available.
# ─────────────────────────────────────────────────────────────────────────────
  uc9-mode-switch-config:
    name: 'UC-9: mode-switch with runner-config'
    runs-on: ubuntu-latest
    environment: integration
    needs: lint-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Start WireMock Runner
        run: bash scripts/start-wiremock-runner.sh
        env:
          WMC_API_TOKEN: ${{ secrets.WIREMOCK_API_TOKEN }}

      - name: Allow extra settle time before mode-switch
        run: sleep 5

      - name: Switch to record-many with batch config
        uses: ./
        with:
          command: mode-switch
          target-mode: record-many
          runner-admin-url: http://localhost:9999
          runner-config: |
            max-batch-requests: 50

      - name: Verify Runner is in record-many mode
        run: |
          HEALTH=$(curl -s http://localhost:9999/__/health)
          echo "Health response: $HEALTH"

      - name: Switch back to serve mode
        uses: ./
        with:
          command: mode-switch
          target-mode: serve
          runner-admin-url: http://localhost:9999

      - name: Stop Runner
        if: always()
        run: docker stop wiremock-runner || true
